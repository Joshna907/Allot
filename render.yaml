services:
  - type: web
    name: allot
    runtime: python
    pythonVersion: "3.13.5"
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m allot serve
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOT_DATA_DIR
        value: /tmp/allot-data
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
